        href="styles.css">
    
    <script src="scripts.js" defer></script>
    <script src="planetData/ajax.js" defer></script>
    <title>Planeten Gallery</title>
</head>
<style>
    .PlanetSlides {
        display:none;
    }
</style>
<body>
    <nav id="navigation" class="w3-top">
            <div class="w3-bar nav-leiste">
            <a href="index.html" class="w3-bar-item nav-logo" aria-label="Zur Startseite">&#x1FA90;</a>

            <div>
            <a href="index.html" class="w3-bar-item nav-link">Startseite</a>

            </div>
          </div>
        </nav>
    
    <section id="gallery">
    <h1>Unser Sonnensystem</h1>

    <div class="PlanetenSlidedshow">
        <button class="Lefty" onclick="plusDivs(-1)">&#10094;</button>
        <button class="Righty" onclick="plusDivs(1)">&#10095;</button>

        <img class="PlanetSlides" src="img/Mercury.jpg">
        <img class="PlanetSlides" src="img/Venus.jpg">
        <img class="PlanetSlides" src="img/Erde.jpg">
        <img class="PlanetSlides" src="img/Mars.jpg">
        <img class="PlanetSlides" src="img/Jupiter.jpg">
        <img class="PlanetSlides" src="img/Saturn.jpg" style="width:500px;">
        <img class="PlanetSlides" src="img/Uranus.png">
        <img class="PlanetSlides" src="img/Neptun.png">
    </div>
</section>

    <p>Wähle einen Planeten aus um mehr über diesen zu erfahren</p>

    <div id="planetselector">
        <label for="Planeten">Wähle einen Planeten: </label>
        <select name="Planeten" id="planetDataSelection" onchange="displayPlanetDataByName(this.value)">
            <option value="none" id="disableOnSelection">keine Auswahl</option>
            <option value="mercury">Merkur</option>
            <option value="venus">Venus</option>
            <option value="earth">Erde</option>
            <option value="mars">Mars</option>
            <option value="jupiter">Jupiter</option>
            <option value="saturn">Saturn</option>
            <option value="uranus">Uranus</option>
            <option value="neptune">Neptun</option>
        </select>
    </div>
    <div id ="planetDataOutput">

    </div>
